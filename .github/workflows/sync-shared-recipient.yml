name: Sync shared build recipients
on:
  push:
    branches: [shared-build-recipient-2026-10-18]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and apply reviewed source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, tarfile
          archive = Path('.github/fostinis-shared-recipient-source.tar.xz')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '2b5e67cf0cfbdbcf5e54ebda5714ecc1ac7157a903be650eba214bda5ed99116'
          with tarfile.open(archive) as tar:
              members = tar.getmembers()
              assert len(members) == 250
              for member in members:
                  path = Path(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] in ['public', 'scripts', 'src', 'lib']
              tar.extractall('.', filter='data')
          PY
      - name: Commit synchronized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public scripts src lib
          git diff --cached --quiet && exit 0
          git commit -m 'Add shared guitar recipient actions, order nicknames and social logos'
          git push origin HEAD:shared-build-recipient-2026-10-18
