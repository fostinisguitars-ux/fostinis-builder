name: Import complete Fostinis showroom
on:
  push:
    branches: [launch-full-showroom-2026-10-17]
    paths: ['.github/workflows/import-showroom.yml', 'scripts/import-site.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: launch-full-showroom-2026-10-17
      - name: Import and verify complete source and visual assets
        env:
          SOURCE_ARCHIVE_SHA256: 35e6de192b737b00d0d2b92510cc5ae79d12d17895c8077e4841e536227657f0
        run: python3 -u scripts/import-site.py
      - name: Save the complete project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "The verified snapshot is already current."
          else
            git commit -m "Import complete Fostinis showroom, source, 3D models, and visual assets"
            git push origin HEAD:launch-full-showroom-2026-10-17
          fi
