name: Sync build sharing and saved guitars
on:
  push:
    branches: ["share-and-save-builds-2026-10-17"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: share-and-save-builds-2026-10-17
      - name: Import the verified published source patch
        shell: python
        run: |
          import hashlib, pathlib, tarfile
          archive = pathlib.Path(".github/fostinis-sharing-source.tar.xz")
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == "0ecea372b984ea600ffea2b5b8ce2cf1a16d3ff90ffdd4a11c2970cc83bf468b", "Source patch checksum mismatch"
          with tarfile.open(archive, "r:xz") as bundle:
              members = bundle.getmembers()
              assert len(members) == 253, "Unexpected source file count"
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and ".." not in path.parts
                  assert path.parts[0] in ("public", "scripts", "src", "BUILD_SHARING.md")
              bundle.extractall(".", filter="data")
          print("Imported 253 verified sharing and saved-build files")
      - name: Commit the published source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_SHARING.md public scripts src
          if git diff --cached --quiet; then
            echo "Published source is already current"
          else
            git commit -m "Add branded build sharing, guitar nicknames, and saved builds"
            git push origin HEAD:share-and-save-builds-2026-10-17
          fi
