name: Sync copy button fix
on:
  push:
    branches: ["fix-copy-buttons-2026-10-18"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply verified source update
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, tarfile
          archive = pathlib.Path(".github/fostinis-copy-fix-source.tar.xz")
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == "7446ae9b6b11b8ce8e4792e6f0d3645e4e7641fa9c75ee483fa30c68c6b27524"
          with tarfile.open(archive, "r:xz") as tar:
              members = tar.getmembers()
              assert len(members) == 240
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and ".." not in path.parts
                  assert path.parts[0] in ("public", "scripts", "src")
              tar.extractall(".", filter="data")
          PY
      - name: Commit updated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public scripts src
          git commit -m "Fix build link and full appointments copy buttons"
          git push origin HEAD:fix-copy-buttons-2026-10-18
