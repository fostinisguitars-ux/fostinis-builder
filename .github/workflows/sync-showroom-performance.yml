name: Sync showroom performance improvements
on:
  push:
    branches: ["showroom-performance-2026-10-18"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply verified source update
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, tarfile
          archive = pathlib.Path(".github/fostinis-performance-source.tar.xz")
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == "e694ae4f46a3039c546aa29b174d06b63362dec83d3b7c28b8bb0505ff81842e"
          with tarfile.open(archive, "r:xz") as tar:
              members = tar.getmembers()
              assert len(members) == 248
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and ".." not in path.parts
                  assert path.parts[0] in ("public", "scripts", "src")
              tar.extractall(".", filter="data")
          PY
      - name: Commit updated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public scripts src
          git commit -m "Reduce showroom render work and defer off-screen previews"
          git push origin HEAD:showroom-performance-2026-10-18
