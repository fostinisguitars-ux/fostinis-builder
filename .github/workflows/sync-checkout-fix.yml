name: Synchronize verified checkout fix
on:
  push:
    branches: [fix-checkout-custom-domains-2026-10-17]
    paths: ['scripts/sync-commerce-pricing.mjs', 'lib/commerce/commerce.test.mjs', '.github/workflows/sync-checkout-fix.yml']
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix-checkout-custom-domains-2026-10-17
      - name: Synchronize the checkout host check on all standalone pages
        run: node scripts/sync-commerce-pricing.mjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "The pages already match the corrected checkout source."
          else
            git commit -m "Enable Stripe checkout on both Fostinis custom domains across all pages"
            git push origin HEAD:fix-checkout-custom-domains-2026-10-17
          fi
